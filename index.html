<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- TITLE -->
  <title>OFFpolice — Official Links</title>

  <meta
    name="description"
    content="OFFpolice — official links to Telegram, Instagram and X. Find all official OFFpolice social media profiles in one place."
  >

  <meta
    name="keywords"
    content="OFFpolice, OFFpolice links, OFFpolice Telegram, OFFpolice Instagram, OFFpolice X"
  >

  <meta name="author" content="OFFpolice">

  <!-- Search engine indexing -->
  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  >

  <meta
    name="googlebot"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  >

  <!-- Canonical URL -->
  <link rel="canonical" href="https://offpolice.pro/">

  <!-- Favicon -->
  <link

    href="./static/icon/favicon.ico"
    type="image/x-icon"
  >

  <link
    rel="apple-touch-icon"
    href="https://raw.githubusercontent.com/OFFpolice/my/refs/heads/main/static/avatars/offpolice.webp"
  >

  <!-- Theme -->
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://offpolice.pro/">
  <meta property="og:title" content="OFFpolice — Official Links">

  <meta
    property="og:description"
    content="Official OFFpolice links to Telegram, Instagram and X."
  >

  <meta
    property="og:image"
    content="https://videotourl.com/images/1788799093328-78f961f8-7aa6-4b67-9b0e-f0c9cdb83b1a.jpg"
  >

  <meta property="og:image:alt" content="OFFpolice">

  <meta property="og:site_name" content="OFFpolice">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OFFpolice — Official Links">

  <meta
    name="twitter:description"
    content="Official OFFpolice links to Telegram, Instagram and X."
  >

  <meta
    name="twitter:image"
    content="https://videotourl.com/images/1788799093328-78f961f8-7aa6-4b67-9b0e-f0c9cdb83b1a.jpg"
  >

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "OFFpolice",
    "url": "https://offpolice.pro/",
    "image": "https://raw.githubusercontent.com/OFFpolice/my/refs/heads/main/static/avatars/offpolice.webp",
    "sameAs": [
      "https://telegram.me/OFFpolice",
      "https://www.instagram.com/offpolice2077",
      "https://x.com/OFFpolice2077"
    ]
  }
  </script>

  <!-- Styles -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./static/css/style.css?v=0.0.0.5"
  >

  <!-- Telegram WebApp -->
  <script
    src="https://telegram.org/js/telegram-web-app.js?59"
  ></script>

</head>

<body class="loading">

  <!-- Preloader -->
  <div id="preloader">
    <div class="spinner"></div>
  </div>

  <!-- Main content -->
  <main class="card">

    <header>

      <div class="avatar">
        <img
          src="https://raw.githubusercontent.com/OFFpolice/my/refs/heads/main/static/avatars/offpolice.webp"
          alt="OFFpolice profile"
          width="120"
          height="120"
          loading="eager"
        >
      </div>

      <h1>OFFpolice</h1>

      <p class="subtitle">
        Official OFFpolice links
      </p>

    </header>

    <!-- Social links -->
    <nav
      class="links"
      aria-label="OFFpolice social media links"
    >

      <a
        href="https://telegram.me/OFFpolice"
        target="_blank"
        rel="noopener noreferrer"
        class="link-btn"
        aria-label="OFFpolice on Telegram"
      >
        <i class="bi bi-telegram" aria-hidden="true"></i>
        Telegram
      </a>

      <a
        href="https://www.instagram.com/offpolice2077"
        target="_blank"
        rel="noopener noreferrer"
        class="link-btn"
        aria-label="OFFpolice on Instagram"
      >
        <i class="bi bi-instagram" aria-hidden="true"></i>
        Instagram
      </a>

      <a
        href="https://x.com/OFFpolice2077"
        target="_blank"
        rel="noopener noreferrer"
        class="link-btn"
        aria-label="OFFpolice on X"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          viewBox="0 0 1200 1227"
          aria-hidden="true"
        >
          <path d="M714.163 519.284L1160.89 0H1053.39L671.31 441.204 357.02 0H0L468.409 681.821 0 1226.39h107.5l403.17-469.96 333.12 469.96H1200L714.163 519.284zM566.91 691.04l-46.6-65.176L146.38 79.4h158.13l298.14 416.528 46.6 65.176 398.76 555.452H890.89L566.91 691.04z"/>
        </svg>

        X.com

      </a>

    </nav>

    <footer>

      <p>
        © 2026
        <a
          href="https://telegram.me/OFFpolice"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-link"
        >
          @OFFpolice
        </a>
      </p>

    </footer>

  </main>

  <!-- Telegram WebApp -->
  <script>
    window.addEventListener("load", () => {

      document.body.classList.remove("loading");

      if (window.Telegram && window.Telegram.WebApp) {

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        tg.enableClosingConfirmation();
        tg.disableVerticalSwipes();

        if (typeof tg.requestFullscreen === "function") {
          tg.requestFullscreen();
        }

        if (typeof tg.lockOrientation === "function") {
          tg.lockOrientation();
        }

        console.log(
          "Telegram WebApp is ready:",
          tg.initData
        );

      } else {

        console.warn(
          "Telegram WebApp not found."
        );

      }

    });
  </script>

</body>
</html>
